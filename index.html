      document.getElementById('category-selection').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'flex';
      document.getElementById('btn-back').style.display = 'block';
      document.getElementById('app-title').textContent = quizCategories[key].name;
      resetQuizUI();
      displayQuestion();
    }

    function backToMenu() {
      document.getElementById('category-selection').style.display = 'grid';
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('btn-back').style.display = 'none';
      document.getElementById('btn-prev').style.display = 'none';
      document.getElementById('app-title').textContent = '中学理科 一問一答';
      document.getElementById('header-stats').textContent = '- / -';
      document.getElementById('progress-fill').style.width = '0%';
    }

    function resetQuizUI() {
      document.getElementById('quiz-screen').innerHTML = `
        <div class="quiz-card">
          <div><div class="question-number" id="question-num"></div><div class="question-text" id="question"></div></div>
          <div class="answer-section"><div id="answer-display" class="answer-text"></div></div>
          <div class="button-group" id="reveal-group"><button class="btn-reveal" onclick="revealAnswer()">解答を表示</button></div>
          <div class="button-group" id="memory-buttons" style="display: none; gap: 12px;">
            <button class="btn-remember" onclick="markRemembered()">✓ 覚えていた</button>
            <button class="btn-forgot" onclick="markForgot()">✗ 忘れていた</button>
          </div>
        </div>`;
    }

    function displayQuestion() {
      const q = currentQuizData[currentIndex];
      document.getElementById('question-num').textContent = `第${q.num}問`;
      document.getElementById('question').textContent = q.question;
      const prefix = isReviewMode ? "復習: " : "";
      document.getElementById('header-stats').textContent = `${prefix}${currentIndex + 1} / ${currentQuizData.length}`;
      document.getElementById('progress-fill').style.width = ((currentIndex + 1) / currentQuizData.length * 100) + '%';
      document.getElementById('answer-display').textContent = '';
      document.getElementById('reveal-group').style.display = 'flex';
      document.getElementById('memory-buttons').style.display = 'none';
      document.getElementById('btn-prev').style.display = currentIndex > 0 ? 'block' : 'none';
    }

    function revealAnswer() {
      document.getElementById('answer-display').textContent = currentQuizData[currentIndex].answer;
      document.getElementById('reveal-group').style.display = 'none';
      document.getElementById('memory-buttons').style.display = 'flex';
    }

    function markRemembered() { nextQuestion(); }
    function markForgot() {
      const q = currentQuizData[currentIndex];
      if (!forgottenQuestions.find(fq => fq.num === q.num)) forgottenQuestions.push(q);
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIndex < currentQuizData.length - 1) { currentIndex++; displayQuestion(); } 
      else { showCompletion(); }
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; displayQuestion(); } }

    function showCompletion() {
      const screen = document.getElementById('quiz-screen');
      if (isReviewMode || forgottenQuestions.length === 0) {
        screen.innerHTML = `<div class="quiz-card"><div style="text-align:center;"><div style="font-size:48px;">🎉</div><div style="font-size:24px; font-weight:600; margin-bottom:20px;">全問完了！</div><button class="btn-restart" style="background:#667eea; color:white; padding:12px 24px; border-radius:8px;" onclick="backToMenu()">メニューに戻る</button></div></div>`;
      } else {
        screen.innerHTML = `<div class="quiz-card"><div style="text-align:center;"><div style="font-size:48px;">📚</div><div style="font-size:20px; font-weight:600; margin-bottom:20px;">忘れていた${forgottenQuestions.length}問を復習しますか？</div><div class="button-group"><button class="btn-remember" onclick="startReview()">復習開始</button><button class="btn-forgot" style="background:#718096" onclick="backToMenu()">終了</button></div></div></div>`;
      }
    }

    function startReview() {
      isReviewMode = true; currentQuizData = [...forgottenQuestions].sort(() => Math.random() - 0.5);
      currentIndex = 0; forgottenQuestions = []; resetQuizUI(); displayQuestion();
    }

    initMenu();
  </script>
 </body>
</html>
